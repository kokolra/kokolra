<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCTV App</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 30px; background-color: #f0f2f5; color: #333; }
    h1 { color: #1a73e8; }
    video { width: 90%; max-width: 500px; border-radius: 8px; background-color: #000; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    #controls { margin-top: 20px; margin-bottom: 20px; }
    button { padding: 12px 24px; font-size: 16px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-cam { background-color: #28a745; color: white; }
    .btn-view { background-color: #007bff; color: white; }
    #status { font-weight: bold; color: #555; margin-top: 15px; }
    #peerIdDisplay { background-color: #fff; padding: 10px; display: inline-block; border-radius: 5px; border: 1px dashed #1a73e8; margin-top: 10px; word-break: break-all; max-width: 80%; }
  </style>
</head>
<body>
  <h1>나만의 모바일 CCTV</h1>
  <div id="controls">
    <button class="btn-cam" onclick="startCamera()">카메라 모드 (공폰)</button>
    <button class="btn-view" onclick="startViewer()">뷰어 모드 (내폰)</button>
  </div>
  <div>
    <video id="videoElement" autoplay muted playsinline></video>
  </div>
  <p id="status">모드를 선택해 주세요.</p>
  <div id="peerIdDisplay" style="display:none;"></div>

  <script>
    let peer;
    let localStream;
    
    // 연결을 더 확실하게 만들어주는 구글 무료 STUN 서버 설정
    const peerConfig = {
      config: {
        'iceServers': [
          { 'urls': 'stun:stun.l.google.com:19302' },
          { 'urls': 'stun:stun1.l.google.com:19302' }
        ]
      }
    };

    function startCamera() {
      document.getElementById('status').innerText = '카메라 권한을 요청 중입니다...';
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: true })
        .then(stream => {
          localStream = stream;
          document.getElementById('videoElement').srcObject = stream;
          
          // 안정적인 설정 적용하여 Peer 생성
          peer = new Peer(peerConfig);
          
          peer.on('open', (id) => {
            const displayDiv = document.getElementById('peerIdDisplay');
            displayDiv.style.display = 'inline-block';
            displayDiv.innerText = id;
            document.getElementById('status').innerText = '카메라 작동 중! 아래 ID를 복사해서 뷰어 폰에 입력하세요.';
          });

          peer.on('call', (call) => {
            document.getElementById('status').innerText = '뷰어가 연결되었습니다!';
            call.answer(localStream);
          });
          
          peer.on('error', (err) => {
            document.getElementById('status').innerText = '에러 발생: ' + err.type;
          });
        })
        .catch(err => {
          document.getElementById('status').innerText = '카메라 연결 실패: ' + err.message;
        });
    }

    function startViewer() {
      const id = prompt('연결할 CCTV ID를 입력해주세요:');
      if (!id) return;

      document.getElementById('status').innerText = 'CCTV에 연결을 시도하고 있습니다...';
      
      // 뷰어 폰도 동일한 안정적 설정 적용
      peer = new Peer(peerConfig);
      
      peer.on('open', () => {
        // 카메라 스트림 없이 영상만 받도록 호출
        const call = peer.call(id.trim(), null);
        
        call.on('stream', (remoteStream) => {
          const video = document.getElementById('videoElement');
          video.srcObject = remoteStream;
          video.muted = false; // 뷰어에서는 소리가 들리도록 설정
          document.getElementById('status').innerText = '실시간 CCTV 연결 성공!';
        });
        
        setTimeout(() => {
          if(document.getElementById('status').innerText.includes('시도')) {
            document.getElementById('status').innerText = '연결 시간이 초과되었습니다. ID를 다시 확인하거나 신호 상태를 보세요.';
          }
        }, 10000);
      });

      peer.on('error', (err) => {
        document.getElementById('status').innerText = '뷰어 에러 발생: ' + err.type;
      });
    }
  </script>
</body>
</html>
